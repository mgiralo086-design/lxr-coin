<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LXR COIN Mining</title>

<style>
body {
  background: #080d18;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
.card {
  background: #151d30;
  padding: 25px;
  border-radius: 20px;
  max-width: 400px;
  margin: auto;
}
.coin {
  color: gold;
  font-size: 32px;
  font-weight: bold;
}
.balance {
  font-size: 28px;
  color: gold;
}
button {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border: none;
  border-radius: 12px;
  background: gold;
  font-size: 16px;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="card">
  <div class="coin">🪙 LXR COIN</div>
  <h2>Mining Dashboard</h2>

  <p>তোমার ব্যালেন্স</p>
  <div class="balance" id="balance">0.0000 LXR</div>

  <p>Mining Rate: 10 LXR / Hour</p>
  <p id="status">Mining বন্ধ</p>

  <button onclick="startMining()">⛏️ Start Mining</button>
  <button onclick="claim()">Claim Coins</button>
</div>

<script>
let balance = Number(localStorage.getItem("lxrBalance") || 0);
let mining = false;
let timer;

function updateBalance() {
  document.getElementById("balance").innerText =
    balance.toFixed(4) + " LXR";
}

function startMining() {
  if (mining) return;

  mining = true;
  document.getElementById("status").innerText = "Mining চলছে";

  timer = setInterval(function() {
    balance += 10 / 3600;
    localStorage.setItem("lxrBalance", balance);
    updateBalance();
  }, 1000);
}

function claim() {
  alert("Demo coins claimed!");
}

updateBalance();
</script>
</body>
</html>
